<!DOCTYPE html>
<html lang="en">

<head>
    <title>HTML Test</title>
    <meta charset="UTF-8">
    <style type="text/css">
        h3 {
            text-align: left
        }

        p,
        h1,
        h2 {
            text-align: center
        }

        div strong {
            color: red
        }

        a:link {
            color: green
        }

        a:visited {
            color: red
        }

        p:hover {
            color: red
        }
    </style>
</head>

<body>
    <div>
        <p>The red style <strong>has been applied to this element.</strong></p>
    </div>
    <p>The red style <strong>has not been applied to this element.</strong></p>

    <a href="http://by.cuc.edu.cn/">Visit CUC Website</a>

    <a href="http://by.cuc.edu.cn/">Visit CUC Website</a>

    <p>The red style is applied when the mouse cursor hovers over this element.</p </body>

</html>
